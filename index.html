<!doctype html>
<html lang="pt-BR" data-marca="todas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#011E3B">
<link rel="icon" href="https://bio.buscadorgeek.com.br/assets/logo.jpg">
<meta name="robots" content="noindex,nofollow">
<title>Tropolis Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Identidade Buscador Geek (creme, noite, laranja; Titan One + Nunito; botões "de brinquedo" com sombra embaixo).
   A cor de destaque muda com o seletor de marca: body[data-marca] = buscadorgeek (laranja) · brunotropolis (azul) · todas (laranja + detalhes azuis). */
:root{
  --noite:#011E3B; --creme:#FBE4BE; --laranja:#F95509; --azulb:#2F7DF6; --areia:#D5BA9A;
  --geek:#F95509; --bruno:#2F7DF6;
  --ig:#E1306C; --fb:#3B7DED; --tt:#16C7C1; --yt:#E53935;
  --t:"Titan One","Arial Black",system-ui,sans-serif; --f:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:20px; --rs:14px;
  /* claro */
  --bg:#FBE4BE; --card:#FFFAF1; --card2:#F6EAD6; --ink:#011E3B; --line:#011E3B; --line2:#E2CFB2;
  --tx:#011E3B; --mut:#4A3E36; --sombra:0 4px 0 var(--ink);
  --acc:#F95509; --acc-esc:#B83C00; --acc-tx:#011E3B; --acc2:#2F7DF6; --acc-suave:#FFE2CC;
  --ok:#17803F; --warn:#A35A00; --bad:#C0291B; --roxo:#6A3FD0; --azul:#1D62C9;
  --tr:background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease;
  color-scheme:light;
}
html[data-marca="brunotropolis"]{ --bg:#DCE8FA; --card:#F7FAFF; --card2:#E8F0FC; --line2:#BFD2EE; --acc:#2F7DF6; --acc-esc:#1650B8; --acc-tx:#011E3B; --acc2:#F95509; --acc-suave:#D3E3FD; }
html[data-marca="todas"]{ --bg:#ECE8E2; --card:#FFFFFF; --card2:#F2EFEA; --line2:#D6D0C6; --acc:#F95509; --acc-esc:#B83C00; --acc2:#2F7DF6; --acc-suave:#FFE2CC; }
@media (prefers-color-scheme:dark){
  :root{ --bg:#011E3B; --card:#0F3762; --card2:#16426F; --ink:#000D1B; --line:#4A78A8; --line2:#2A5584;
    --tx:#FBE4BE; --mut:#D6C7AE; --sombra:0 4px 0 #000D1B; --acc-suave:#3A1E0E;
    --ok:#4CD98A; --warn:#FFB45C; --bad:#FF7A6E; --roxo:#B99BFF; --azul:#7CB3FF; color-scheme:dark; }
  html[data-marca="buscadorgeek"]{ --bg:#1C120B; --card:#3A2514; --card2:#48301B; --line:#8A5D36; --line2:#5E3F24; --ink:#0D0704; --acc-suave:#4A2412; }
  html[data-marca="brunotropolis"]{ --bg:#06182F; --card:#133260; --card2:#1A3E72; --line:#4D7DBE; --line2:#2C5590; --ink:#020B17; --acc:#4C90FF; --acc-suave:#16345E; }
  html[data-marca="todas"]{ --bg:#101722; --card:#243147; --card2:#2C3B55; --line:#566A8C; --line2:#3A4B68; --ink:#05080D; --acc-suave:#3A2114; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);transition:background-color .45s ease;color:var(--tx);font:16px/1.45 var(--f)}
body{padding:0 0 calc(88px + env(safe-area-inset-bottom));transition:var(--tr)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;user-select:none;touch-action:manipulation}
a{color:var(--acc-esc);font-weight:700}
@media (prefers-color-scheme:dark){a{color:var(--acc)}}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* topo */
header{position:sticky;top:0;z-index:5;background:var(--noite);color:var(--creme);padding-top:env(safe-area-inset-top);border-bottom:4px solid var(--acc);transition:var(--tr)}
.top{display:flex;align-items:center;gap:10px 12px;min-height:64px;flex-wrap:wrap;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font:400 22px/1 var(--t);letter-spacing:.01em}
.logo img{width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);background:var(--laranja);object-fit:cover;transition:var(--tr)}
.logo span{color:var(--acc);transition:var(--tr)}
.sp{flex:1}
.seg{display:flex;background:#ffffff14;border:2px solid #ffffff2b;border-radius:999px;padding:3px;gap:2px;order:3;width:100%}
@media(min-width:760px){.seg{order:0;width:auto}}
.seg button{flex:1;min-height:40px;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:900;color:#FBE4BEcc;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;transition:background-color .3s ease,color .3s ease}
.seg button i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #ffffff40}
.seg button.on{background:var(--acc);color:var(--acc-tx)}
.seg button[data-mk="todas"].on{background:linear-gradient(90deg,var(--laranja),var(--laranja) 55%,var(--azulb))}
.top .btn.ghost{background:#ffffff14;color:var(--creme);box-shadow:none;border:2px solid #ffffff2b}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;font-weight:900;line-height:1.1;border:2.5px solid var(--ink);background:var(--card);color:var(--tx);box-shadow:0 3px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease,background-color .45s ease,color .45s ease}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.am,.btn.or{background:var(--acc);color:var(--acc-tx)}
.btn.ghost{background:var(--card2)}
.btn.bad{background:transparent;color:var(--bad);border-color:transparent;box-shadow:none}
.btn.s{padding:7px 13px;font-size:14px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.s:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
@media (prefers-color-scheme:dark){
  .btn{border-color:var(--ink)}
  .peca,.card,.kpi,.grafico,.lado,.colar,table{border-color:var(--line)}
  .peca .capa{border-bottom-color:var(--line)}
  .colar input,input.in,textarea.in,select.in,.lado textarea,.lado input{border-color:var(--line)}
  h2.sec,.marca-bloco > .mkh b{color:var(--creme)}
  .par .antes{border-color:var(--line);color:#E2D5BF}
  .par .lb,.modelo .small{color:#E2D5BF}
}
::placeholder{color:var(--mut);opacity:.85}
/* títulos e textos */
h2.sec{font:400 26px/1.05 var(--t);margin:22px 0 6px;letter-spacing:.01em}
.dica{color:var(--mut);font-size:15px;margin:0 0 14px;max-width:68ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);color:var(--tx);font-size:14px;font-weight:800;white-space:nowrap;transition:var(--tr)}
.chip.on{background:var(--noite);border-color:var(--noite);color:var(--creme)}
@media (prefers-color-scheme:dark){.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}}
.chip .n{opacity:.7;margin-left:4px}
.empty{color:var(--mut);text-align:center;padding:24px 16px 26px;border:2.5px dashed var(--line2);border-radius:var(--r);font-weight:700;display:grid;justify-items:center;gap:8px}
.empty::before{content:"";width:74px;height:74px;background:url(https://bio.buscadorgeek.com.br/assets/achado.png) center/contain no-repeat;opacity:.95}
.load{color:var(--mut);padding:40px 0;text-align:center;font-weight:700}
.small{font-size:13px;color:var(--mut)}
.mk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:2px solid currentColor}
.mk.brunotropolis{color:#fff;background:var(--bruno);border-color:var(--bruno)}
.mk.buscadorgeek{color:#fff;background:#D9480B;border-color:#D9480B}
.tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tag.f{color:var(--tx);background:var(--acc-suave)}
.tag.p1{color:#fff;background:var(--bad)}
.st{font-size:13px;font-weight:900}
.st.ideia{color:var(--mut)} .st.a_produzir{color:var(--warn)} .st.produzido{color:var(--roxo)} .st.agendado{color:var(--azul)} .st.postado,.st.publicado{color:var(--ok)} .st.erro,.st.descartado{color:var(--bad)} .st.ajuste{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* peças */
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));padding:4px 0 10px}
@media(max-width:480px){.grade{grid-template-columns:1fr 1fr;gap:10px}}
.peca{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sombra);transition:var(--tr)}
.peca .capa{position:relative;display:block;width:100%;aspect-ratio:4/5;background:var(--card2) center/cover no-repeat;padding:0;border-bottom:2.5px solid var(--ink)}
.peca .capa .bd{position:absolute;right:8px;top:8px;background:var(--noite);color:var(--creme);font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px}
.peca .capa .mk{position:absolute;left:8px;top:8px}
.peca .corpo{padding:10px 12px 12px;display:grid;gap:5px}
.peca .t{font-weight:900;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* nav de baixo */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--noite);border-top:4px solid var(--acc);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));transition:var(--tr)}
nav.tab button{flex:1;max-width:150px;min-height:48px;padding:7px 2px;border-radius:14px;color:#FBE4BEd9;font-size:12px;font-weight:900;display:grid;justify-items:center;gap:2px;position:relative;transition:background-color .3s ease,color .3s ease}
nav.tab button b{font-size:19px;line-height:1}
nav.tab button.on{color:var(--acc-tx);background:var(--acc)}
nav.tab .n{position:absolute;top:1px;right:calc(50% - 24px);background:var(--creme);color:var(--noite);font-size:10px;font-weight:900;border-radius:99px;padding:0 5px;min-width:16px;border:1.5px solid var(--noite);box-shadow:0 0 0 1.5px var(--creme)}
/* agenda */
.calhd{display:flex;align-items:center;gap:8px;margin:14px 0}
.calhd .m{font:400 22px/1 var(--t);min-width:170px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dw{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:2px 0;font-weight:900}
.dia{background:var(--card);border:2px solid var(--line2);border-radius:14px;min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:var(--tr)}
.dia.fora{opacity:.4}
.dia.hoje{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.dia .d{font-size:12px;font-weight:900;color:var(--mut)}
.ev{display:grid;grid-template-columns:5px 1fr;gap:6px;background:var(--card2);border-radius:10px;padding:4px 6px 4px 0;text-align:left;width:100%;min-width:0;overflow:hidden;transition:var(--tr)}
.ev .bar{border-radius:10px 0 0 10px}
.ev .x{min-width:0;display:grid;gap:1px}
.ev .h{font-size:11px;font-weight:900;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ev .tt{font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .w{font-size:11px;color:var(--mut);font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.ev.publicado .tt{opacity:.7}
.ev.erro{outline:2px solid var(--bad)}
.rd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:900;color:#fff}
.rd.instagram{background:var(--ig)}.rd.facebook{background:var(--fb)}.rd.tiktok{background:#0B8F8B}.rd.youtube{background:var(--yt)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--areia)}
.lista-dia{display:none}
@media(max-width:760px){.cal{display:none}.lista-dia{display:grid;gap:12px}}
.ld h4{margin:8px 0 6px;font:400 15px/1.2 var(--t);color:var(--tx);text-transform:capitalize}
.ld .ev{padding:9px 10px 9px 0;grid-template-columns:6px 1fr;background:var(--card);border:2px solid var(--line2)}
.ld .ev .tt{font-size:15px;white-space:normal}
.ld .ev .h,.ld .ev .w{font-size:12.5px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);font-weight:800;align-items:center;margin:4px 0 10px}
/* pautas */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.kcol{background:var(--card2);border:2px solid var(--line2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;align-self:start;transition:var(--tr)}
.kcol h3{margin:2px 4px;font:400 14px/1.2 var(--t);letter-spacing:.02em;display:flex;justify-content:space-between}
.kcol h3 span:last-child{background:var(--noite);color:var(--creme);border-radius:99px;padding:1px 9px;font:900 12px/1.5 var(--f)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px;display:grid;gap:7px;box-shadow:0 3px 0 var(--ink);transition:var(--tr)}
.card .t{font-weight:900;font-size:15.5px;line-height:1.25}
.card .i{color:var(--mut);font-size:13.5px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.kcol > .small{border:2px dashed var(--line2);border-radius:12px;padding:18px 10px!important;text-align:center;font-weight:800}
@media(max-width:480px){.grade:has(.prod){grid-template-columns:1fr}}
.thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--card2);display:block;border:2px solid var(--line2)}
/* crescimento */
.kpis{margin-top:6px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
@media(max-width:480px){.kpis{grid-template-columns:1fr 1fr;gap:10px}}
.kpi{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0;box-shadow:var(--sombra);transition:var(--tr)}
.kpi .hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900}
.kpi .v{font:400 30px/1.05 var(--t);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi .g{font-size:13.5px;font-weight:900}
.kpi .g.up{color:var(--ok)}.kpi .g.dn{color:var(--bad)}.kpi .g.zero{color:var(--mut)}
.kpi .sub{font-size:12.5px;color:var(--mut);font-weight:700;display:flex;gap:4px 10px;flex-wrap:wrap}
.kpi.sem .v{font:900 15px/1.3 var(--f);color:var(--mut);padding:8px 0}
.spark{width:100%;height:38px;display:block}
.grafico{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);padding:14px;margin:14px 0;box-shadow:var(--sombra);transition:var(--tr)}
.grafico h3{margin:0 0 2px;font:400 17px/1.2 var(--t)}
.grafico svg{width:100%;height:auto;display:block}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--noite);color:var(--creme);border-radius:12px;padding:8px 11px;font-size:12.5px;font-weight:700;display:none;max-width:240px}
.top3{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.mp{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:8px;align-items:center;text-decoration:none;color:var(--tx);min-width:0;font-weight:400;transition:var(--tr)}
.mp img{width:64px;height:80px;object-fit:cover;border-radius:10px;background:var(--card2)}
.mp .t{font-size:13.5px;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marca-bloco{margin-bottom:28px}
.marca-bloco > .mkh{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.marca-bloco > .mkh b{font:400 24px/1 var(--t)}
/* produtos */
.prod{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px;align-items:center}
.prod img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid var(--line2)}
.prod .t{font-size:14px;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preco{font:400 18px/1 var(--t);color:var(--laranja);-webkit-text-stroke:.7px var(--noite);paint-order:stroke fill}
.preco s{font:700 12px var(--f);color:var(--mut);-webkit-text-stroke:0;margin-left:6px}
.colar{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);padding:10px;box-shadow:var(--sombra)}
.colar input{flex:1 1 240px;min-width:0;background:var(--bg);border:2px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
td,th{padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--line2);font-size:14px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:900}
.tab-wrap{overflow-x:auto;padding-bottom:6px}
/* folhas */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.sheet .bk{position:absolute;inset:0;background:#011E3Bb3}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-top-left-radius:24px;border-top-right-radius:24px;border:2.5px solid var(--ink);padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.sheet .pn{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);width:680px;border-radius:24px;animation:none;box-shadow:0 6px 0 var(--ink)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.pn h2{font:400 26px/1.1 var(--t);margin:4px 0 14px}
label.f{display:grid;gap:6px;margin-bottom:14px;font-size:13.5px;font-weight:900;color:var(--mut)}
input.in,textarea.in,select.in{width:100%;background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:12px;font-size:16px;color:var(--tx);outline:none;transition:border-color .2s}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--acc)}
textarea.in{min-height:90px;resize:vertical}
textarea.in.big{min-height:160px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick .chip{padding:9px 14px}
.refs{display:grid;gap:8px}
.ref{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:8px}
.ref img{width:48px;height:48px;object-fit:cover;border-radius:10px;flex:none}
.ref a{font-size:13px;word-break:break-all}
.ref .x{margin-left:auto;color:var(--bad);font-size:18px;padding:4px 8px}
.refadd{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.foot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 4px}

const $=s=>document.querySelector(s);

const TZ='America/Sao_Paulo';
const diaBR=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:TZ});
const horaBR=d=>new Date(d).toLocaleTimeString('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const dataBR=(d,hr)=>{if(!d)return'';const x=new Date(String(d).length===10?d+'T12:00:00':d);return x.toLocaleDateString('pt-BR',{timeZone:TZ,day:'2-digit',month:'short'})+(hr?' '+horaBR(x):'')};

const REDE={instagram:['IG','Instagram'],facebook:['FB','Facebook'],tiktok:['TT','TikTok'],youtube:['YT','YouTube']};
const ETAPAS=[['ideia','Ideia'],['a_produzir','Produzindo'],['produzido','Pra aprovar'],['agendado','Agendado'],['postado','Postado']];

function toast(t,erro){const e=$('#toast');e.textContent=t;e.classList.toggle('erro',!!erro);e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
async function chamar(rota,body){
  const r=await fetch(rota,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401||r.status===403){toast('Sessão expirou, recarregando…');setTimeout(()=>location.reload(),1200);throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.erro||j.ok===false) throw new Error(j.erro||('erro '+r.status));
  return j;
}

const geek=(acao,d)=>chamar('/api/geek',{acao,...(d||{})});
async function carregar(){

  if(a.status==='fulfilled') E=Object.assign(E,a.value); else if(a.reason.message!=='auth') toast('Tropolis Lab não carregou: '+a.reason.message,true);
  if(b.status==='fulfilled') G=Object.assign(G,b.value); else if(b.reason.message!=='auth') toast('Buscador Geek não carregou: '+b.reason.message,true);
  $('#app').style.opacity=1; render();
}

const temVideo=m=>(m||[]).some(x=>/video/i.test(x.tipo||'')||/\.mp4($|\?)/i.test(x.url||''));

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

    <span class="h">${horaBR(p.quando)} ${redes}${st==='publicado'?' <span class="small">✓</span>':st==='erro'?' <span style="color:var(--bad)">erro</span>':''}</span>
    <span class="tt">${h(p.titulo||p.tipo)}</span>
    ${p.tem_automacao||p.palavra?`<span class="w"><span class="dot ${p.automacao_ativa?'on':'off'}"></span>${h(p.palavra||'automação')}</span>`:''}</span></button>`;
}

    <span><span class="rd instagram">I</span> <span class="rd facebook">F</span> <span class="rd tiktok">T</span> <span class="rd youtube">Y</span> redes</span><span><span class="dot on"></span> automação ligada <span class="dot off"></span> desligada</span></div>
    <div class="cal">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="dw">${d}</div>`).join('')}${cel}</div>
    <div class="lista-dia">${diasMes.length?diasMes.map(k=>`<div class="ld" ${k>=hoje&&!window._hj?(window._hj=1,'id="ldHoje"'):''}><h4>${new Date(k+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'})}</h4><div style="display:grid;gap:6px">${por[k].map(evento).join('')}</div></div>`).join(''):'<div class="empty">Nada neste mês.</div>'}</div>`;

// ---------- CRESCIMENTO ----------
function semana(d){const x=new Date(d+'T12:00:00Z');const dw=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-dw);return x.toISOString().slice(0,10)}
function balde(d){return periodo==='mes'?d.slice(0,7):periodo==='semana'?semana(d):d}
function rotBalde(k){if(periodo==='mes'){const [y,m]=k.split('-');return MESES[+m-1].slice(0,3)+'/'+y.slice(2)}const x=new Date(k+'T12:00');return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function janela(){const n=periodo==='mes'?400:periodo==='semana'?91:30;const d=new Date(Date.now()-n*864e5);return d.toISOString().slice(0,10)}
function spark(serie,cor){
  const v=serie.filter(x=>x.seguidores!=null); if(v.length<2) return '';
  const lo=Math.min(...v.map(x=>x.seguidores)),hi=Math.max(...v.map(x=>x.seguidores)),W=200,H=38,sp=Math.max(1,hi-lo);
  const pts=v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-3-(x.seguidores-lo)/sp*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function blocoMarca(mk){
  const ini=janela(); const C=E.crescimento.filter(r=>r.marca===mk);
  const kp=['instagram','facebook','tiktok','youtube'].map(rd=>{
    const s=C.filter(r=>r.rede===rd); const ult=[...s].reverse().find(r=>r.seguidores!=null);
    if(!ult) return `<div class="kpi sem"><div class="hd"><span class="rd ${rd}">${REDE[rd][0][0]}</span>${REDE[rd][1]}</div><div class="v">sem dado</div><div class="sub">conta não ligada ou a rede não informa</div></div>`;
    const jan=s.filter(r=>r.data>=ini); const base=jan.find(r=>r.seguidores!=null);
    const g=base&&base!==ult?ult.seguidores-base.seguidores:null;
    const soma=k=>{const v=jan.filter(r=>r[k]!=null);return v.length?v.reduce((a,r)=>a+Number(r[k]),0):null};
    const al=soma('alcance'),vi=soma('visualizacoes'),cu=rd==='tiktok'?soma('curtidas_dia'):soma('curtidas'),co=soma('comentarios');
    return `<div class="kpi"><div class="hd"><span class="rd ${rd}">${REDE[rd][0][0]}</span>${REDE[rd][1]}</div>
      <div class="v">${fmt(ult.seguidores)}</div>
      <div class="g ${g==null?'zero':g>0?'up':g<0?'dn':'zero'}">${g==null?'ganho: ainda sem histórico':(g>0?'+':'')+fmt(g)+' no período'}</div>
      ${spark(jan,`var(--${rd==='instagram'?'ig':rd==='facebook'?'fb':rd==='tiktok'?'tt':'yt'})`)}
      <div class="sub"><span>alcance somado ${al==null?'sem dado':fmt(al)}</span>${vi!=null?`<span>views ${fmt(vi)}</span>`:''}<span>curtidas ${cu==null?'sem dado':fmt(cu)}</span><span>coment. ${co==null?'sem dado':fmt(co)}</span></div></div>`;
  }).join('');
  // barras empilhadas de ganho por período e rede
  const bs={}; for(const r of C.filter(r=>r.data>=ini&&r.ganho!=null)){const k=balde(r.data);(bs[k]=bs[k]||{})[r.rede]=((bs[k]||{})[r.rede]||0)+Number(r.ganho)}
  const ks=Object.keys(bs).sort();
  let graf='<div class="small" style="padding:20px 0;text-align:center">Ainda sem histórico suficiente pra curva. O robô grava todo dia às 8h20.</div>';
  if(ks.length){
    const W=Math.max(320,ks.length*28),H=200,PL=34,PB=26,PT=10;
    const pos=k=>Object.values(bs[k]).filter(v=>v>0).reduce((a,b)=>a+b,0), neg=k=>Object.values(bs[k]).filter(v=>v<0).reduce((a,b)=>a+b,0);
    const mx=Math.max(1,...ks.map(pos)), mn=Math.min(0,...ks.map(neg)); const sp=mx-mn; const y=v=>PT+(mx-v)/sp*(H-PT-PB);
    const bw=Math.min(22,(W-PL)/ks.length*.7);
    let bars='';
    ks.forEach((k,i)=>{const x=PL+(i+.5)*(W-PL)/ks.length-bw/2;let up=0,dn=0;
      for(const rd of ['instagram','facebook','tiktok','youtube']){const v=bs[k][rd];if(!v)continue;const cor=`var(--${rd==='instagram'?'ig':rd==='facebook'?'fb':rd==='tiktok'?'tt':'yt'})`;
        if(v>0){bars+=`<rect x="${x.toFixed(1)}" y="${y(up+v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y(up)-y(up+v)).toFixed(1)}" fill="${cor}" rx="2"/>`;up+=v}
        else{bars+=`<rect x="${x.toFixed(1)}" y="${y(dn).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y(dn+v)-y(dn)).toFixed(1)}" fill="${cor}" opacity=".5" rx="2"/>`;dn+=v}}
      const tot=Object.values(bs[k]).reduce((a,b)=>a+b,0);
      bars+=`<rect x="${(PL+i*(W-PL)/ks.length).toFixed(1)}" y="${PT}" width="${((W-PL)/ks.length).toFixed(1)}" height="${H-PT-PB}" fill="transparent" data-tip="${h(rotBalde(k)+': '+(tot>0?'+':'')+fmt(tot)+' seguidores · '+Object.entries(bs[k]).map(([r,v])=>REDE[r][0]+' '+(v>0?'+':'')+fmt(v)).join(' · '))}"/>`;
      if(ks.length<=16||i%Math.ceil(ks.length/12)===0) bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" fill="var(--mut)" font-size="10" text-anchor="middle">${rotBalde(k)}</text>`;});
    graf=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganho de seguidores por período"><line x1="${PL}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)"/>
      <text x="${PL-6}" y="${y(mx)+4}" fill="var(--mut)" font-size="10" text-anchor="end">${fmt(mx)}</text><text x="${PL-6}" y="${y(0)+4}" fill="var(--mut)" font-size="10" text-anchor="end">0</text>${mn<0?`<text x="${PL-6}" y="${y(mn)+4}" fill="var(--mut)" font-size="10" text-anchor="end">${fmt(mn)}</text>`:''}${bars}</svg>`;
  }
  const mel=E.melhores.filter(m=>m.marca===mk).flatMap(m=>(m.melhores||[]).map(x=>({...x,rede:m.rede}))).sort((a,b)=>((b.curtidas||0)+2*(b.comentarios||0))-((a.curtidas||0)+2*(a.comentarios||0))).slice(0,6);
  return `<section class="marca-bloco"><div class="mkh"><span class="dot" style="width:12px;height:12px;background:var(--${mk==='buscadorgeek'?'geek':'bruno'})"></span><b>${MARCA[mk]}</b></div>
    <div class="kpis">${kp}</div>
    <div class="grafico"><h3>Seguidores ganhos por ${periodo==='mes'?'mês':periodo==='semana'?'semana':'dia'}</h3><div class="small" style="margin-bottom:8px">Cada cor é uma rede. Dia sem número da rede fica de fora (não conta como zero).</div><div style="overflow-x:auto">${graf}</div></div>
    <h3 style="margin:14px 0 8px;font-size:15px">O que mais engajou (últimos 30 dias)</h3>

function lerModelo(mk){

function passos(a){
  const nos=a.nos||[]; const out=[];
  out.push({ic:'💬',t:`Alguém comenta ${h((a.gatilhos||[]).filter(g=>!g.startsWith('#')).join(' ou ')||'a palavra')}`,c:''});
  const rp=a.respostas_publicas&&a.respostas_publicas.length?a.respostas_publicas:(a.resposta_publica?[a.resposta_publica]:[]);
  if(rp.length) out.push({ic:'↩',t:`Resposta no comentário${rp.length>1?' (sorteia 1 de '+rp.length+')':''}`,c:rp.map(x=>`<div class="bolha">${h(x)}</div>`).join('')});
  let i=0;
  while(i<nos.length){const n=nos[i];
    if(n.tipo==='randomizador'){const r=nos.filter(x=>x.ordem===nos[i+1]?.ordem&&x.tipo==='mensagem');out.push({ic:'📩',t:`Direct: abertura (sorteia 1 de ${r.length})`,c:r.map(msgHtml).join('')});i+=1+r.length;continue}
    if(n.tipo==='mensagem') out.push({ic:'📩',t:'Direct',c:msgHtml(n)});
    else if(n.tipo==='atraso') out.push({ic:'⏱',t:`Espera ${Math.round((n.config.segundos||0)/60)} min`,c:''});
    else if(n.tipo==='tag'&&n.config.pular_se_tags) out.push({ic:'1×',t:'Só manda o próximo uma vez por pessoa',c:''});
    i++;}
  return `<div class="fluxo">${out.map(p=>`<div class="passo"><span class="ic">${p.ic}</span><div class="cx"><span class="tt2">${p.t}</span>${p.c}</div></div>`).join('')}</div>`;
}
function msgHtml(n){return (n.config.mensagens||[]).map(m=>`<div class="bolha">${linkify(m.texto||'')}${(m.botoes||[]).map(b=>`<div>${b.url?`<a class="botao-dm" href="${h(b.url)}" target="_blank" rel="noopener">${h(b.label)}</a>`:`<span class="botao-dm">${h(b.label)}</span>`}</div>`).join('')}</div>`).join('')}
function cartaoAuto(a){

    <div style="min-width:0;display:grid;gap:3px"><span class="pal">${h((a.gatilhos||[])[0]||'')}</span><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p?h(p.titulo||'')+' · '+dataBR(p.quando,1):h(a.nome)}</span>

    <button class="btn s ${a.ativo?'am':'ghost'}" data-auto="${h(a.id)}" data-v="${a.ativo?0:1}" aria-label="${a.ativo?'Desligar':'Ligar'}">${a.ativo?'Ligada':'Desligada'}</button></div>
    <div class="nums"><span>💬 ${fmt(a.comentarios)} comentários</span><span>📩 ${fmt(a.dms)} receberam</span><span>👆 ${fmt(a.cliques)} cliques</span>${a.ultimo?`<span>último ${dataBR(a.ultimo,1)}</span>`:''}</div>

  tr.querySelectorAll('.sl').forEach((s,k)=>{const v=s.querySelector('video'); if(v){ if(k===i){v.currentTime=0;v.play().catch(()=>{})} else v.pause(); }});

  const ij=t.closest('[data-ijan]'); if(ij){iniJan=+ij.dataset.ijan;ls.set('est-ini-jan',String(iniJan));return vInicio()}
  const et=t.closest('[data-etapa]'); if(et){etapaSel=et.dataset.etapa;ls.set('est-etapa',etapaSel);return vPautas2()}
  const fx=t.closest('[data-fluxo]'); if(fx){abertos.has(fx.dataset.fluxo)?abertos.delete(fx.dataset.fluxo):abertos.add(fx.dataset.fluxo);return vAutomacoes()}
  const cxb=t.closest('[data-cx]'); if(cxb){cxTipo=cxb.dataset.cx;CX=null;return vCaixa()}
  const ct=t.closest('[data-ct]'); if(ct) return abrirConversa(ct.dataset.ct);
  const tb=t.closest('#tabs button:not([data-mais])'); if(tb){vista=tb.dataset.v;ls.set('est-vista',vista);render();window.scrollTo(0,0);return}
  const g=t.closest('[data-geek]'); if(g) return abrirGeek(g.dataset.geek);
  const b=t.closest('[data-bruno]'); if(b) return abrirBruno(b.dataset.bruno);
  const ev=t.closest('[data-ev]'); if(ev) return abrirEvento(ev.dataset.ev);
  const ir=t.closest('[data-ir]'); if(ir){const tr=$('#tr');tr.scrollBy({left:tr.clientWidth*(+ir.dataset.ir),behavior:'smooth'});return}
  const ms=t.closest('[data-mes]'); if(ms){const v=+ms.dataset.mes;mesRef=v?new Date(mesRef.getFullYear(),mesRef.getMonth()+v,1):new Date();return vAgenda()}
  const pe=t.closest('[data-per]'); if(pe){periodo=pe.dataset.per;ls.set('est-periodo',periodo);return vCrescimento()}
  const ga=t.closest('[data-ga]'); if(ga){geekAba=ga.dataset.ga;return vGeek()}
  const lj=t.closest('[data-loja]'); if(lj){filtroLoja=lj.dataset.loja;return vGeek()}
  const ed=!t.closest('[data-mv]')&&t.closest('[data-ed]'); if(ed) return abrirPauta(E.pautas.find(p=>p.id===ed.dataset.ed));
  const rx=t.closest('[data-rx]'); if(rx){refs.splice(+rx.dataset.rx,1);renderRefs();return}
  const ap=t.closest('[data-ap]'); if(ap){aprovId=ap.dataset.ap;const p=E.posts.find(x=>x.id===aprovId)||{};$('#apTxt').textContent=(p.titulo||'Post')+' vai pro '+((p.plataformas||[]).map(r=>(REDE[r]||[r,r])[1]).join(', ')||'Instagram')+' do @brunotropolis no horário escolhido.';
    const d=p.agendado_para?new Date(p.agendado_para):new Date(Date.now()+864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#apQuando').value=d.toISOString().slice(0,16);$('#aprov').classList.add('on');return}
  try{
    const mv=t.closest('[data-mv]'); if(mv){mv.disabled=true;await api({acao:'status',id:mv.dataset.mv,status:mv.dataset.to});toast('Movida');return carregar()}
    const pg=t.closest('[data-pegar]'); if(pg){pg.disabled=true;await geek('oferta_pegar',{oferta_id:pg.dataset.pegar});toast('Escolhido');return carregar()}
    const st=t.closest('[data-st]'); if(st){st.disabled=true;await geek('produto_status',{id:st.dataset.st,status:st.dataset.v});return carregar()}
    const au=t.closest('[data-auto]'); if(au){au.disabled=true;await geek('automacao_ligar',{id:au.dataset.auto,ativo:au.dataset.v==='1'});toast(au.dataset.v==='1'?'Automação ligada':'Automação desligada');await carregarAutomacoes();return carregar()}
    const ms=t.closest('[data-msalvar]'); if(ms){ms.disabled=true;await api({acao:'modelo_salvar',marca:ms.dataset.msalvar,textos:lerModelo(ms.dataset.msalvar)});toast('Ajustes salvos (ainda não trocou no ar)');return carregarAutomacoes()}
    const ma=t.closest('[data-maprovar]'); if(ma){if(!confirm('Trocar os textos de TODAS as automações dessa marca pelos novos? As que estão no ar passam a responder assim na hora.'))return;ma.disabled=true;
      await api({acao:'modelo_salvar',marca:ma.dataset.maprovar,textos:lerModelo(ma.dataset.maprovar)});const r=await api({acao:'modelo_aprovar',marca:ma.dataset.maprovar});toast('Textos trocados ('+(((r.linhas||[])[0]||{}).trocas||0)+' mensagens)');return carregarAutomacoes()}
    const rs=t.closest('[data-responder]'); if(rs){const tx=$('#respTx').value.trim();if(!tx)return;rs.disabled=true;await api({acao:'responder',contato_id:rs.dataset.responder,marca:rs.dataset.mk,texto:tx});toast('Enviado');cxMsgs=(await api({acao:'conversa',contato_id:rs.dataset.responder})).mensagens||[];return mostraConversa(innerWidth<900)}
  }catch(er){if(er.message!=='auth')toast(er.message,true);t.closest('button')&&(t.closest('button').disabled=false)}
});
document.addEventListener('pointermove',e=>{const tip=$('#tip');const r=e.target.closest&&e.target.closest('[data-tip]');if(!r){tip.style.display='none';return}tip.textContent=r.dataset.tip;tip.style.display='block';tip.style.left=Math.min(innerWidth-250,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px'});
$('#apOk').onclick=async()=>{const v=$('#apQuando').value;if(!v){toast('Escolhe dia e hora');return}
  try{await api({acao:'aprovar',conteudo_id:aprovId,agendado_para:new Date(v).toISOString()});fechar();fecharVw();toast('Agendado');carregar()}catch(e){if(e.message!=='auth')toast('Erro: '+e.message,true)}};
$('#novaBtn').onclick=()=>abrirPauta(null);
$('#recarregar').onclick=()=>{A=null;CX=null;carregar()};
$('#fSalvar').onclick=()=>salvar();
$('#fDescartar').onclick=()=>{if(confirm('Descartar esta pauta?'))salvar('descartado')};
$('#fRefAdd').onclick=addLink; $('#fRefUrl').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLink()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){fechar();fecharVw()}
  if($('#vw').classList.contains('on')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const tr=$('#tr');if(tr)tr.scrollBy({left:tr.clientWidth*(e.key==='ArrowRight'?1:-1),behavior:'smooth'})}});
render(); carregar();
</script>
</body>
</html>
